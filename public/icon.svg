<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>
    <radialGradient id="visorGlass" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>
  </defs>

  <!-- Background circle/square -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Ambient Bubbles -->
  <circle cx="100" cy="120" r="18" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" stroke-width="2" />
  <circle cx="120" cy="80" r="10" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" stroke-width="2" />
  <circle cx="420" cy="180" r="22" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" stroke-width="2" />
  <circle cx="390" cy="110" r="14" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" stroke-width="2" />

  <!-- Sunken Gold Coins around base -->
  <circle cx="160" cy="410" r="38" fill="url(#goldGlow)" stroke="#fef08a" stroke-width="4" />
  <circle cx="360" cy="410" r="38" fill="url(#goldGlow)" stroke="#fef08a" stroke-width="4" />
  <circle cx="260" cy="430" r="44" fill="url(#goldGlow)" stroke="#fef08a" stroke-width="5" />

  <!-- Diving Helmet Back Collar -->
  <path d="M156 360 C156 400 356 400 356 360 Z" fill="#0f172a" />
  <rect x="176" y="340" width="160" height="30" rx="10" fill="#334155" stroke="#64748b" stroke-width="4" />

  <!-- Main Brass/Navy Diving Helmet Dome -->
  <circle cx="256" cy="240" r="120" fill="#1e293b" stroke="#38bdf8" stroke-width="8" />

  <!-- Visor Rim (Bronze/Gold) -->
  <circle cx="256" cy="245" r="75" fill="#f59e0b" stroke="#fef08a" stroke-width="6" />

  <!-- Visor Glass (Glowing Cyan) -->
  <circle cx="256" cy="245" r="62" fill="url(#visorGlass)" />

  <!-- Visor Glint Reflection -->
  <ellipse cx="235" cy="225" rx="28" ry="16" transform="rotate(-30 235 225)" fill="rgba(255,255,255,0.7)" />

  <!-- Helmet Rivets -->
  <circle cx="256" cy="130" r="7" fill="#fbbf24" />
  <circle cx="145" cy="240" r="7" fill="#fbbf24" />
  <circle cx="367" cy="240" r="7" fill="#fbbf24" />

  <!-- Sparkles -->
  <path d="M380 90 L385 105 L400 110 L385 115 L380 130 L375 115 L360 110 L375 105 Z" fill="#fde047" />
  <path d="M120 280 L124 292 L136 296 L124 300 L120 312 L116 300 L104 296 L116 292 Z" fill="#fde047" />
</svg>
